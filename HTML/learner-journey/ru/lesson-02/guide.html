<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Памятка перед учебным днём</title>
    </head>
    <body>
        <header>
            <h1>Готовимся к учебному дню</h1>
        </header>
        <main>
            <section>
                <h2>Что подготовить</h2>
                <p>
                    <strong>Сохраните работу</strong> перед закрытием редактора.</p>
                <ul>
                    <li>Ноутбук</li>
                    <li>Тетрадь</li>
                    <li>План занятия</li>
                </ul>
            </section>
            <section>
                <h2>Порядок подготовки</h2>
                <ol>
                    <li>Освободите рабочее место.</li>
                    <li>Откройте материалы.</li>
                    <li>Запишите цель занятия.</li>
                </ol>
            </section>
        </main>
        <footer>
            <p>
                <small>Учебная памятка; последовательность можно адаптировать.</small>
            </p>
        </footer>
    </body>
