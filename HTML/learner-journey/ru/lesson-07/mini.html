<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Выбор страны</title>
    </head>
    <body>
        <h1>Выберите страну</h1>
        <form method="get">
            <label for="country">Страна</label>
            <select id="country" name="country">
                <option value="uz" selected>Узбекистан</option>
                <option value="kz">Казахстан</option>
                <option value="kg">Кыргызстан</option>
            </select>
            <button type="submit">Показать учебный выбор</button>
        </form>
    </body>
</html>
