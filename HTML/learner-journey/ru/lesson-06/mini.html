<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Любимый напиток</title>
    </head>
    <body>
        <h1>Ваш любимый напиток</h1>
        <form method="get">
            <input type="radio" id="tea" name="drink" value="tea">
            <label for="tea">Чай</label>
            <input type="radio" id="coffee" name="drink" value="coffee">
            <label for="coffee">Кофе</label>
            <input type="radio" id="juice" name="drink" value="juice">
            <label for="juice">Сок</label>
            <input type="submit" value="Проверить учебный выбор">
        </form>
    </body>
</html>
