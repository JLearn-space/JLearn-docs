<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Учебная запись на курс</title>
    </head>
    <body>
        <h1>Учебная запись на курс</h1>
        <p>Только вымышленные данные; отправка показывает значения в адресе и не сохраняет заявку.</p>
        <form method="get">
            <p>
                <label for="student">Учебное имя</label>
                <input type="text" id="student" name="student" required>
            </p>
            <p>
                <label for="email">Учебный email</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="start">Дата начала</label>
                <input type="date" id="start" name="start">
            </p>
            <p>Интересы:</p>
            <input type="checkbox" id="text" name="topics" value="text">
            <label for="text">Разметка текста</label>
            <input type="checkbox" id="links" name="topics" value="links">
            <label for="links">Навигация</label>
            <p>Формат занятия:</p>
            <input type="radio" id="morning" name="time" value="morning">
            <label for="morning">Утро</label>
            <input type="radio" id="evening" name="time" value="evening">
            <label for="evening">Вечер</label>
            <p>
                <input type="submit" value="Показать учебные значения в URL">
            </p>
        </form>
    </body>
</html>
