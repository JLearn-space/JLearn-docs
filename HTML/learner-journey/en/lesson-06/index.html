<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Practice registration</title>
    </head>
    <body>
        <h1>Practice registration</h1>
        <form method="get">
            <p>Fictional practice data only. No message is delivered.</p>
            <label for="name">Name</label>
            <input id="name" name="name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
            <label for="start">Start date</label>
            <input id="start" name="start" type="date">
            <p>Topics</p>
            <input id="poems" name="topics" type="checkbox" value="poems">
            <label for="poems">Poems</label>
            <input id="stories" name="topics" type="checkbox" value="stories">
            <label for="stories">Stories</label>
            <p>Session</p>
            <input id="morning" name="session" type="radio" value="morning">
            <label for="morning">Morning</label>
            <input id="evening" name="session" type="radio" value="evening">
            <label for="evening">Evening</label>
            <input type="submit" value="View values in URL">
        </form>
    </body>
</html>
