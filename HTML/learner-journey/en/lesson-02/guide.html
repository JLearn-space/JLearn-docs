<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Study morning guide</title>
    </head>
    <body>
        <header>
            <h1>A calm study morning</h1>
        </header>
        <main>
            <section>
                <h2>Supplies</h2>
                <ul>
                    <li>Notebook</li>
                    <li>Water</li>
                    <li>A short reading</li>
                </ul>
                <p>
                    <strong>Put distractions away</strong> before starting.</p>
            </section>
            <section>
                <h2>Steps</h2>
                <ol>
                    <li>Choose one goal.</li>
                    <li>Read for twenty minutes.</li>
                    <li>Write a summary.</li>
                </ol>
                <p>Focus on <em>one</em> question.</p>
            </section>
        </main>
        <footer>
            <p>
                <small>Adjust breaks to your needs.</small>
            </p>
        </footer>
    </body>
</html>
