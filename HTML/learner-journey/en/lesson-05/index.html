<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Timetable</title>
    </head>
    <body>
        <h1>Reading timetable</h1>
        <table>
            <caption>Reading timetable</caption>
            <thead>
                <tr>
                    <th scope="col">Day</th>
                    <th scope="col">Topic</th>
                    <th scope="col">Minutes</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Monday</th>
                    <td>Poetry</td>
                    <td>20</td>
                </tr>
                <tr>
                    <th scope="row">Wednesday</th>
                    <td>Stories</td>
                    <td>30</td>
                </tr>
                <tr>
                    <th scope="row">Friday</th>
                    <td>Discussion</td>
                    <td>40</td>
                </tr>
            </tbody>
        </table>
        <table>
            <caption>Session resources</caption>
            <tbody>
                <tr>
                    <th colspan="2">Bring both items</th>
                </tr>
                <tr>
                    <td>Book</td>
                    <td>Notebook</td>
                </tr>
            </tbody>
        </table>
        <p>The first row has one cell spanning two columns; the next has two cells, so both rows occupy two columns.</p>
    </body>
</html>
