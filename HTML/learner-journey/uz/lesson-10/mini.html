<!DOCTYPE html>

        <title>Sayt rejasi</title>
    </head>
    <body>
        <h1>Yakuniy sayt rejasi</h1>
        <ul>
            <li>Bosh sahifa: klub va rasm.</li>
            <li>Klub haqida: maqsad va qoidalar.</li>
            <li>Uchrashuvlar: mazmunli jadval.</li>
            <li>Ishtirok: namuna forma.</li>
        </ul>
        <p>Darsda alohida mini-vazifa yo‘q; bu rejalashtirish mashqining natijasi.</p>
    </body>
</html>
